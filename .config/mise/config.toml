# mise のグローバル設定。ここに書いたツールはどのディレクトリでも使える。
# プロジェクトに mise.toml や .tool-versions があれば、そちらの版が優先される。
#
# 版の更新:
#   mise outdated --bump   # 新しい版があるツールを一覧する
#   mise upgrade --bump    # 全ツールを最新に上げ、このファイルの版も書き換える
#   mise use -g fzf@latest # 1 つだけ上げる

[settings]
# 公開から 7 日経っていない版は選ばない (サプライチェーン対策)。
# `mise upgrade --bump` や `@latest` の解決に効く
minimum_release_age = "7d"

[tools]
direnv = "2.37.1"
ghq = "1.10.1"
ripgrep = "15.2.0"
fzf = "0.74.4"
starship = "1.26.0"
neovim = "stable"
github-cli = "2.102.0"
terraform = "1.16.4"
# aws-cli は GitHub Releases を作らずタグだけを打つので、mise が公開日時を取れず
# minimum_release_age が効かない。bump したら公開から 7 日経っているかタグの日時で確かめる
awscli = { version = "2.37.1", symlink_bins = "true" }
eza = "0.23.5"
task = "3.53.1"
# git の diff 表示用 (設定は ~/.config/git/config)
delta = "0.19.2"
difftastic = "0.71.0"
# delta の pager (設定は ~/.config/zsh/.zshrc と ~/.config/bash/bashrc の DELTA_PAGER)
"aqua:noborus/ov" = "0.54.0"
shellcheck = "0.11.0"
